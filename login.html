<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153c35">
  <title>تسجيل الدخول | AL-MOTAMAYEZ</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-intro">
      <img class="login-logo" src="assets/al-motamayez-logo.png" alt="شعار المصنع">
      <h1 class="login-brand-title" dir="ltr">AL-MOTAMAYEZ</h1>
      <p class="intro-copy">منظومة موحدة لإدارة التصنيع والطلبات والإنتاج، بخطوات دقيقة وجودة تليق بعملائنا.</p>
    </section>
    <section class="login-card">
      <div class="card-heading"><h2>الدخول إلى النظام</h2><p>أدخل اسم المستخدم وكلمة المرور، أو أنشئ حسابًا جديدًا.</p></div>
      <div class="auth-tabs" id="auth-tabs">
        <button class="auth-tab active" type="button" data-auth-mode="login">تسجيل الدخول</button>
        <button class="auth-tab" type="button" data-auth-mode="signup">إنشاء حساب</button>
      </div>
      <p id="auth-message" class="auth-message" role="status" aria-live="polite" hidden></p>
      <section id="login-panel">
        <form id="login-form" class="form-stack">
          <label for="login-username">اسم المستخدم</label>
          <input id="login-username" name="username" autocomplete="username" required>
          <label for="login-password">كلمة المرور</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          <button class="button button-primary button-full" type="submit">دخول إلى حسابي <span aria-hidden="true">←</span></button>
        </form>
      </section>
      <section id="signup-panel" hidden>
        <form id="signup-form" class="form-stack">
          <label for="signup-full-name">الاسم الكامل</label>
          <input id="signup-full-name" name="fullName" autocomplete="name" required>
          <label for="signup-username">اسم المستخدم</label>
          <input id="signup-username" name="username" autocomplete="username" required>
          <label for="signup-password">كلمة المرور</label>
          <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <button class="button button-primary button-full" type="submit">إرسال طلب إنشاء الحساب</button>
        </form>
      </section>
      <p class="auth-security-note">هذه نسخة محلية؛ الحسابات والطلبات محفوظة في هذا المتصفح ولا تتم مشاركتها بين الأجهزة.</p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
