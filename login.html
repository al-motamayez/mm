<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153c35">
  <title>تسجيل الدخول | قسم المتميز - مصنع خيط وإبرة</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-intro">
      <a class="brand brand-light" href="login.html"><img class="brand-logo" src="assets/al-motamayez-logo.jpeg" alt="شعار قسم المتميز"><span class="brand-copy"><strong>قسم المتميز</strong><span>مصنع خيط وإبرة</span></span></a>
      <p class="eyebrow">مصنع خيط وإبرة</p>
      <h1>قسم المتميز</h1>
      <p class="intro-copy">منظومة موحدة لإدارة التصنيع والطلبات والإنتاج، بخطوات دقيقة وجودة تليق بعملائنا.</p>
    </section>
    <section class="login-card">
      <div class="card-heading"><p class="eyebrow">قسم المتميز - مصنع خيط وإبرة</p><h2>تسجيل الدخول</h2><p>اختر نوع الحساب وأدخل اسم المستخدم للمتابعة.</p></div>
      <form id="login-form" class="form-stack">
        <label for="role">نوع الحساب</label>
        <select id="role" name="role" required>
          <option value="admin">مدير النظام</option>
          <option value="cutting">مشرف القص</option>
          <option value="sewing">مشرف الخياطة</option>
          <option value="worker">عامل / عاملة</option>
          <option value="client">عميل</option>
        </select>
        <label for="username">اسم المستخدم أو العميل</label>
        <input id="username" name="username" autocomplete="username" placeholder="اسم المستخدم" required>
        <button class="button button-primary button-full" type="submit">دخول إلى حسابي <span aria-hidden="true">←</span></button>
      </form>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
